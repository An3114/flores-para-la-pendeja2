<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores para ti 💐</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom, #1a0026, #4b004b);
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .titulo {
      font-size: 1.6rem;
      line-height: 1.5;
      padding: 20px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 20px rgba(255, 0, 255, 0.4);
      backdrop-filter: blur(5px);
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 10px #ff8af2, 0 0 20px #ff00ff, 0 0 30px #ff4dff;
      }
      to {
        text-shadow: 0 0 20px #ffb3ff, 0 0 30px #ff66ff, 0 0 40px #ff33cc;
      }
    }

    /* Fondo animado de flores */
    .night {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://i.imgur.com/2vV8Cai.png'); /* imagen transparente de pétalos */
      background-repeat: repeat;
      animation: petals 20s linear infinite;
      opacity: 0.4;
      z-index: -1;
    }

    @keyframes petals {
      0% { background-position: 0 0; }
      100% { background-position: 0 1000px; }
    }
  </style>
</head>
<body>
  <div id="lyrics">
    <h1 class="titulo">
      Estas flores son para la más pendeja, la que siempre anda detrás de un pendejo. 🌸<br><br>
      ❤️ Quiero que sepas que te quiero, pendeja y todo, y lo siento si a veces no te respondo a tiempo. Sorry.<br><br>
      💖 I love you 💖
    </h1>
  </div>

  <div class="night"></div>
</body>
</html>
